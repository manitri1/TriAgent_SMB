# Hermes Agent — TriAgent_SMB 배포용 docker-compose.yml
#
# 형제 프로젝트 TriAgent_MICE/TriAgent_Planner/HermesSMBStaff에서 실제로 검증한 구조를
# 그대로 재사용한다:
#   - ./.hermes → /opt/data : HERMES_HOME. config.yaml, profiles/<role>/(SOUL.md, USER.md,
#     MEMORY.md, skills/), workspace/{orders,inventory,reservations,customer-service,sales,
#     marketing,reports}가 모두 여기 위치한다.
#   - `.hermes/`는 이 저장소가 E:/work/Hermes/TriAgent_SMB에 있으므로 bind mount만으로
#     데이터가 물리적으로 E:에 남는다 — named volume(Docker 내부 VM 디스크)을 쓰지 않는 이유다
#     (docs/08-docker-deployment.md 참고).
#   - working_dir을 /opt/data(= HERMES_HOME 루트)로 고정한다. 우리 SOUL.md/SKILL.md는
#     "workspace/orders/<날짜>.md"처럼 HERMES_HOME 기준 상대경로로 산출물을 지시한다.
#   - 포트 18651/19128/18080/19131은 e:/work/Hermes/ 형제 프로젝트 및 VPS의 다른
#     컨테이너와 겹치지 않도록 실측 조사해 고른 값이다 (docs/08-docker-deployment.md
#     조사 결과). 2026-09-07: 4자리 포트(8xxx/9xxx)가 VPS에 새로 올라오는 다른
#     서비스와 충돌할 여지가 있어 호스트 포트를 5자리(1xxxx) 대역으로 전면 재배치했다.
#     컨테이너 "내부" 포트(8642/9119/8080/8090)는 변경하지 않았다.
#   - ⚠️ 컨테이너명은 `hermes-smb*`가 아니라 `hermes-triagent-smb*`로 짓는다 — 기존
#     `HermesSMBStaff`(포트 8643/9120, 컨테이너명 `hermes-smb*`)와는 이름만 비슷한 별개
#     프로젝트이므로 `docker ps`에서 혼동하지 않도록 명시적으로 구분한다.
#   - `hermes` 서비스는 Playwright/Chromium이 필요한 프로필이 없어(웹 리서치는 web/search로
#     충분) base 이미지(nousresearch/hermes-agent:latest)를 그대로 사용한다 — TriAgent_MICE와
#     달리 커스텀 Dockerfile을 두지 않는다.
#   - `mock-pos`는 POS 시뮬레이터(FastAPI, docs/05-skills-and-tools.md)로, hermes 프로필의
#     code_execution Skill이 컨테이너 네트워크로 호출한다(MOCK_POS_BASE_URL=http://mock-pos:8080).

name: hermes-triagent-smb

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-triagent-smb
    restart: unless-stopped
    command: ["gateway", "run"]
    working_dir: /opt/data
    depends_on:
      - mock-pos
    ports:
      - "18651:8642"   # 호스트 포트를 1xxxx 대역으로 재배치(2026-09-07) — 컨테이너 내부 포트(8642)는 그대로
    volumes:
      - ./.hermes:/opt/data
    # 모델 인증: `.hermes/.env`(커밋 대상 아님, `.hermes/.env.example` 참고)에
    # OPENAI_API_KEY=를 채우면 Hermes Agent CLI가 $HERMES_HOME/.env를 직접 읽는다 —
    # 이 compose 파일에 environment:/env_file:을 별도로 추가할 필요가 없다.

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-triagent-smb-dashboard
    restart: unless-stopped
    depends_on:
      - hermes
    volumes:
      - ./.hermes:/opt/data
    ports:
      - "127.0.0.1:19128:9119"   # 호스트 쪽 노출은 localhost로 제한 (LAN/외부에서는 접근 불가)
    command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
    # ⚠️ 컨테이너 "내부" 바인딩은 0.0.0.0이어야 한다 — 127.0.0.1로 바인딩하면 Docker의 포트
    # 포워딩이 도달하지 못한다. 실제 외부 노출 범위는 위 ports:의 "127.0.0.1:19128:..." 호스트
    # 바인딩이 담당한다. Hermes Agent는 0.0.0.0 바인딩을 감지하면 인증 provider가 없는 한
    # 바인딩 자체를 거부한다 — 2026-08-19 실측: 인증 미설정 상태로는 컨테이너 내부에서
    # dashboard 서비스가 계속 재시작을 반복했고(s6 레벨 크래시 루프라 `docker compose ps`는
    # 계속 "Up"으로만 보임 — docs/08-docker-deployment.md 참고). `dashboard.basic_auth`의
    # username/password_hash/secret이 설정돼 있어야 실제로 뜬다 — 2026-09-07부터 이 저장소가
    # 공개라 그 값들은 이 파일이나 .hermes/config.yaml이 아니라 .hermes/.env(gitignore
    # 대상)의 HERMES_DASHBOARD_BASIC_AUTH_USERNAME/_PASSWORD_HASH/_SECRET로 둔다
    # (env가 config.yaml보다 우선 — docs/19-hermes-desktop-vps-guide.md 7번 참고).
    labels:
      # 이 VPS의 공유 Traefik(80/443, 컨테이너 traefik-traefik-1)이 라벨만으로 자동 라우팅 +
      # Let's Encrypt TLS를 처리한다 — SSH 터널 없이 Hermes Desktop이 상시 접속할 수 있게
      # 하려고 2026-09-07에 추가(docs/19 5번). 대시보드 자체는 계속 basic_auth로 보호됨.
      traefik.enable: "true"
      traefik.http.routers.smb-dashboard.entrypoints: websecure
      traefik.http.routers.smb-dashboard.rule: "Host(`smb-dashboard.srv1923951.hstgr.cloud`)"
      traefik.http.routers.smb-dashboard.tls.certresolver: letsencrypt
      traefik.http.services.smb-dashboard.loadbalancer.server.port: "9119"

  mock-pos:
    build: ./mock-pos
    container_name: hermes-triagent-smb-mock-pos
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      MOCK_POS_API_KEY: ${MOCK_POS_API_KEY:-dev-key}

  webapp:
    # 4화면 커스텀 운영 콘솔(고객 문의/주문 접수/재고 관리/대시보드). 설계 배경은
    # webapp/README.md, 승인된 plan(curried-percolating-ocean.md) 참고.
    build: ./webapp
    container_name: hermes-triagent-smb-webapp
    restart: unless-stopped
    depends_on:
      - hermes
      - mock-pos
    ports:
      - "127.0.0.1:19131:8090"   # dashboard 서비스와 동일하게 localhost 전용 노출
    environment:
      MOCK_POS_BASE_URL: http://mock-pos:8080
      MOCK_POS_API_KEY: ${MOCK_POS_API_KEY:-dev-key}
      STORE_ID: ${STORE_ID:-store_demo}
      HERMES_CONTAINER_NAME: hermes-triagent-smb
      HERMES_BIN_PATH: /opt/hermes/bin/hermes
      # Phase 0 실측(2026-09-04): coordinator 중첩 위임이 200초를 넘긴 사례가 있어
      # 넉넉히 잡는다 (curried-percolating-ocean.md 참고).
      HERMES_EXEC_TIMEOUT_SECONDS: ${HERMES_EXEC_TIMEOUT_SECONDS:-500}
      WEBAPP_BASIC_AUTH_USERNAME: ${WEBAPP_BASIC_AUTH_USERNAME:-admin}
      WEBAPP_BASIC_AUTH_PASSWORD_HASH: ${WEBAPP_BASIC_AUTH_PASSWORD_HASH:?webapp/scripts/hash_password.py로 생성해 .env에 설정할 것}
    volumes:
      # hermes_client.py가 Docker SDK exec_run으로 hermes 컨테이너에 명령을
      # 실행하기 위해 필요 — webapp 컨테이너가 호스트 수준 Docker 제어권을 갖게
      # 되는 트레이드오프를 127.0.0.1 전용 포트 노출로 완화한다(webapp/README.md,
      # docs/06-hitl-approval-design.md와 별개의 알려진 위험 요소로 문서화됨).
      - /var/run/docker.sock:/var/run/docker.sock
