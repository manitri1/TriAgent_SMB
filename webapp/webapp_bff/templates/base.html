<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}마니카페 운영 콘솔{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="/static/app.css?v={{ v }}">
</head>
<body>
  <header class="topnav">
    <a href="/dashboard" class="brand">
      <span class="brand-mark">☕</span>
      <span class="brand-text">마니카페 <em>운영 콘솔</em></span>
    </a>
    <nav>
      <a href="/support" class="{{ 'active' if active == 'support' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5h16a1 1 0 0 1 1 1V16a1 1 0 0 1-1 1H9l-4.5 4V17H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z"/></svg>
        <span>고객 문의</span>
      </a>
      <a href="/orders" class="{{ 'active' if active == 'orders' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h2l1.2 10.4A1.5 1.5 0 0 0 8.7 17.8h9.3a1.5 1.5 0 0 0 1.47-1.2L21 8.5H6.2"/><circle cx="9.5" cy="21" r="1.2" fill="currentColor" stroke="none"/><circle cx="17.5" cy="21" r="1.2" fill="currentColor" stroke="none"/></svg>
        <span>주문 접수</span>
      </a>
      <a href="/inventory" class="{{ 'active' if active == 'inventory' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3.5 8 12 3.5 20.5 8M3.5 8v8.2L12 20.5m-8.5-12.3L12 12m0 0 8.5-4M12 12v8.5m8.5-12.5V16.2L12 20.5"/></svg>
        <span>재고 관리</span>
      </a>
      <a href="/dashboard" class="{{ 'active' if active == 'dashboard' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10m6.5 10V4m6.5 16v-7"/></svg>
        <span>대시보드</span>
      </a>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
