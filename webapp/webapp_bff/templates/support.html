{% extends "base.html" %}
{% block title %}고객 문의 상담 — 마니카페 운영 콘솔{% endblock %}
{% block content %}
<h1>고객 문의 상담</h1>
<p class="lead">customer-service-agent와 직접 대화합니다. 승인이 필요한 작업은 없습니다 — FAQ·불만 접수만 처리합니다.</p>

<section class="panel chat-panel">
  <div id="support-thread" class="chat-thread"></div>
  <div id="support-demo-bar" class="demo-bar"></div>
  <div id="support-quick-replies" class="chip-row"></div>
  <form id="support-form" class="chat-form">
    <input id="support-input" type="text" autocomplete="off" placeholder="예: 오늘 영업시간이 몇시부터야?">
    <button type="submit" class="btn-primary">보내기</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/chat.js?v={{ v }}"></script>
<script>
  initChatWidget({
    formId: "support-form",
    inputId: "support-input",
    threadId: "support-thread",
    profile: "customer-service-agent",
    storageKey: "conversation_id_support",
    placeholderText: "예: 오늘 영업시간이 몇시부터야?",
    demoBarId: "support-demo-bar",
    demoQueue: [
      { label: "영업시간 문의", message: "오늘 영업시간이 몇시부터야?" },
      { label: "주차 문의", message: "주차 가능한가요?" },
      { label: "와이파이 문의", message: "와이파이 비밀번호 알려주세요" },
      { label: "단체 예약 문의", message: "6명이서 갈 건데 예약 가능해요?" },
    ],
    quickRepliesId: "support-quick-replies",
    quickReplies: [
      { label: "영업시간", message: "오늘 영업시간이 몇시부터야?" },
      { label: "주차 가능 여부", message: "주차 가능한가요?" },
      { label: "와이파이 비밀번호", message: "와이파이 비밀번호 알려주세요" },
      { label: "단체 예약", message: "6명이서 갈 건데 예약 가능해요?" },
    ],
  });
</script>
{% endblock %}
